name: Monthly Squad Refresh

on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-squads:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh player squad lists
        run: python -m scraper.squads

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scraper/players.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Refresh player squad lists: $(date -u '+%Y-%m-%d')"
            git push
          fi
